<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>BTTC Online Registration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: school-branded header band, program picker as a two-column card grid,
   then a stepped form card (left rail on desktop, progress bar on phones). */
:root{
  --bg:#f5f3f2; --surface:#ffffff; --ink:#241815; --muted:#6b5e59; --line:#e2dad6;
  --accent:#7d1f12; --btn:#7d1f12; --btn-ink:#ffffff; --soft:#f4e9e5; --gold:#e6b422;
  --band:#3a1511; --band-ink:#fbeccb; --ok:#1d7448; --ok-soft:#e3f3ea; --err:#b3261e; --err-soft:#fbe9e7;
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140e0d; --surface:#1f1715; --ink:#f3ebe8; --muted:#b5a7a1; --line:#3b2e2a;
  --accent:#f0c24a; --btn:#f0c24a; --btn-ink:#2a1005; --soft:#2c211e; --gold:#f0c24a;
  --band:#2a0f0b; --band-ink:#fbeccb; --ok:#6fd19b; --ok-soft:#16301f; --err:#ff8f86; --err-soft:#3a1a17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#140e0d; --surface:#1f1715; --ink:#f3ebe8; --muted:#b5a7a1; --line:#3b2e2a;
  --accent:#f0c24a; --btn:#f0c24a; --btn-ink:#2a1005; --soft:#2c211e; --gold:#f0c24a;
  --band:#2a0f0b; --band-ink:#fbeccb; --ok:#6fd19b; --ok-soft:#16301f; --err:#ff8f86; --err-soft:#3a1a17; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

.top{background:var(--band);border-top:4px solid var(--gold);color:var(--band-ink)}
.top-in{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:54px;height:54px;object-fit:contain;flex:none}
.brand{flex:1;min-width:200px}
.brand b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.2;font-weight:600}
.brand span{font-size:12.5px;opacity:.8;letter-spacing:.04em}
.fb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--band-ink);text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px}
.fb:hover{background:rgba(230,180,34,.16)}

.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.home h1{font-size:clamp(28px,5vw,40px);line-height:1.1}
.lede{color:var(--muted);margin:8px 0 22px;max-width:60ch}
.tabs{display:inline-flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tabnote{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:70ch}
.progs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.prog{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;min-width:0}
.prog:hover{border-color:var(--accent)}
.prog h3{font-size:20px;line-height:1.25}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.ojt{background:var(--gold);color:#3a1511}
.pill.fee{background:var(--ok-soft);color:var(--ok)}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--accent);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.visit{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.visit h4{margin:0 0 4px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.visit p{margin:0}
.foot{margin-top:22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:920px;margin:0 auto}
.card-h{background:var(--band);color:var(--band-ink);padding:20px 24px;display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
.card-h small{display:block;letter-spacing:.14em;font-size:11.5px;text-transform:uppercase;opacity:.75}
.card-h h2{font-size:clamp(20px,4vw,27px);line-height:1.2;margin-top:4px}
.card-h .pill{background:rgba(255,255,255,.14);color:var(--band-ink)}
.cols{display:grid;grid-template-columns:210px minmax(0,1fr)}
.rail{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.rail h5{margin:0 0 6px 6px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.rs{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;color:var(--muted);font-size:14px}
.rs i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.rs.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.rs.on i{background:var(--btn);color:var(--btn-ink)}
.rs.done i{background:var(--ok);color:#fff}
.mprog{display:none;padding:14px 16px 0}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--btn)}
.main{padding:24px;min-width:0}
.kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.main h3{font-size:26px;margin:2px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 14px}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}.w6{grid-column:span 6}
.fld{min-width:0}
.fld label,.lbl{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.rq{color:var(--err)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err);background:var(--err-soft)}
.fld small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.msg{display:block;color:var(--err);font-size:12.5px;font-style:normal;margin-top:4px}
.sect{grid-column:1/-1;margin:10px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.notice{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-style:italic;color:var(--muted);margin:6px 0 10px}
.notice p{margin:0 0 8px}.notice p:last-child{margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt,.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked),.chk:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt input,.chk input{accent-color:var(--btn);width:18px;height:18px;margin:0;flex:none}
.chks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chk{align-items:flex-start;font-size:14px}
.group{margin-bottom:20px}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.row{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.row .fld label{font-size:12.5px}
.btn{border:0;border-radius:9px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.actions{display:flex;justify-content:space-between;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:var(--surface)}
.agebadge{font-size:13px;color:var(--muted)}
.alert{border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:14px}
.alert.err{background:var(--err-soft);color:var(--err)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--soft);color:var(--ink)}
.doc-list{display:flex;flex-direction:column;gap:10px}
.done{max-width:760px;margin:0 auto}
.done h1{font-size:clamp(26px,5vw,36px);margin:6px 0 8px}
.refbox{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;letter-spacing:.06em;background:var(--soft);border:1px dashed var(--accent);padding:8px 16px;border-radius:10px;margin:6px 0 16px}
.summary{width:100%;min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
.panel h3{font-size:20px;margin-bottom:8px}
.panel ul{margin:0;padding-left:20px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.toolbar input{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
pre.det{white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0}

@media (max-width:760px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mprog{display:block}
  .progs,.visit,.opts,.chks{grid-template-columns:minmax(0,1fr)}
  .w2,.w3,.w4{grid-column:span 6}
  .row{grid-template-columns:minmax(0,1fr)}
  .main{padding:18px 16px}
  .actions{padding:14px 16px}
  .card-h{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  else{inner='<input id="f_'+name+'" name="'+name+'" type="'+t+'" value="'+esc(f[name])+'" placeholder="'+esc(o.ph||'')+'"'+(o.ac?' autocomplete="'+o.ac+'"':'')+(o.max?' max="'+o.max+'"':'')+(o.inputmode?' inputmode="'+o.inputmode+'"':'')+'>'}

/* ---------- validation ---------- */
function validate(s){var e={};function need(k,m){if(!String(f[k]||'').trim())e[k]=m||'Required'}
  if(s===0){if(f.dpa!=='agree')e.dpa=f.dpa==='disagree'?'You need to agree to continue.':'Please choose Agree or Disagree.';if(f.notice!=='agree')e.notice=f.notice==='disagree'?'You need to agree to continue.':'Please choose Agree or Disagree.'}
  if(s===1){['lastName','firstName','sex','civil','nationality','barangay','city','province','education','ecName','ecRel'].forEach(function(k){need(k)});
    if(!f.birthdate)e.birthdate='Required';else if(ageOf(f.birthdate)==null||ageOf(f.birthdate)<0)e.birthdate='Enter a valid date.';else if(ageOf(f.birthdate)<18)e.birthdate='You must be at least 18 years old to register.';
    if(!/^(09|\+?639)\d{9}$/.test(String(f.mobile||'').replace(/[\s-]/g,'')))e.mobile='Enter a Philippine mobile number, like 09171234567.';
    if(!/^(09|\+?639)\d{9}$/.test(String(f.ecMobile||'').replace(/[\s-]/g,'')))e.ecMobile='Enter a Philippine mobile number.';
    if(f.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email))e.email='Enter a valid email address.'}
  if(s===2){need('empStatus','Select your status');if(!f.hasJobs)e.hasJobs='Please choose Yes or No.';
    if(f.hasJobs==='yes'&&!f.jobs.some(function(j){return j.employer&&j.position}))e.jobs='Add at least one job with employer and position.'}
  if(s===3){if(!f.hasTesda)e.hasTesda='Please choose Yes or No.';
    if(f.hasTesda==='yes'&&!f.tesda.some(function(j){return j.prog}))e.tesda='Add at least one program.'}
  if(s===4&&mode==='assessment'){need('basis','Select one');need('basisFrom')}
  if(s===5&&(!f.ageOk||!f.fitOk))e.confirm='Please tick both confirmations to submit.';
  return e}

/* ---------- record + summary ---------- */
function makeRef(){var d=new Date(),c='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r='';for(var i=0;i<4;i++)r+=c[Math.floor(Math.random()*c.length)];
  return 'BTTC-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+r}
function buildRecord(){
  var r={ref:ref,type:mode,programId:prog.id,program:prog.name,submittedAt:new Date().toISOString()};
  ['lastName','firstName','middleName','suffix','sex','civil','birthdate','birthplace','nationality','mobile','email','facebook','street','barangay','city','province','education','ecName','ecRel','ecMobile','empStatus','hasJobs','hasTesda','usi','basis','basisFrom','pay','source','notes'].forEach(function(k){r[k]=String(f[k]||'').trim()});
  r.age=ageOf(f.birthdate);
  r.jobs=f.hasJobs==='yes'?f.jobs.filter(function(j){return j.employer||j.position}).map(function(j){return {employer:j.employer||'',position:j.position||'',from:j.from||'',to:j.to||''}}):[];
  r.tesda=f.hasTesda==='yes'?f.tesda.filter(function(j){return j.prog}).map(function(j){return {prog:j.prog||'',center:j.center||'',year:j.year||'',result:j.result||''}}):[];
  r.classif=f.classif.slice();
  r.reqsReady=f.reqs.map(function(i){return reqList()[+i]});
  r.reqsMissing=reqList().filter(function(_,i){return f.reqs.indexOf(String(i))<0});
  r.consent=true;return r}
function fullName(r){return [r.firstName,r.middleName,r.lastName,r.suffix].filter(Boolean).join(' ')}
function summaryText(r){
  var L=[];L.push('BTTC REGISTRATION '+r.ref);
  L.push('Type: '+(r.type==='assessment'?'TESDA assessment':'Training')+' | Program: '+r.program);
  L.push('Submitted: '+new Date(r.submittedAt).toLocaleString('en-PH'));
  L.push('');L.push('Name: '+fullName(r));
  L.push('Sex: '+r.sex+' | Civil status: '+r.civil+' | Birthdate: '+r.birthdate+' (age '+r.age+')');
  L.push('Birthplace: '+(r.birthplace||'-')+' | Nationality: '+r.nationality);
  L.push('Mobile: '+r.mobile+' | Email: '+(r.email||'-')+' | Facebook: '+(r.facebook||'-'));
  L.push('Address: '+[r.street,r.barangay,r.city,r.province].filter(Boolean).join(', '));
  L.push('Education: '+r.education);
  L.push('Emergency contact: '+r.ecName+' ('+r.ecRel+') '+r.ecMobile);
  L.push('Employment status: '+r.empStatus);
  r.jobs.forEach(function(j,i){L.push('  Job '+(i+1)+': '+j.position+' at '+j.employer+(j.from||j.to?' ('+(j.from||'?')+' to '+(j.to||'?')+')':''))});
  L.push('TESDA history: '+(r.hasTesda==='yes'?'Yes':'None'));
  r.tesda.forEach(function(j,i){L.push('  '+(i+1)+'. '+j.prog+(j.center?' at '+j.center:'')+(j.year?', '+j.year:'')+(j.result?' ['+j.result+']':''))});
  if(r.usi)L.push('USI: '+r.usi);
  if(r.type==='assessment')L.push('Assessment basis: '+r.basis+' ('+r.basisFrom+')');
  L.push('Classification: '+(r.classif.length?r.classif.join(', '):'-'));
  L.push('Payment: '+(r.pay||'-')+' | Heard about us: '+(r.source||'-'));
  if(r.notes)L.push('Notes: '+r.notes);
  L.push('Requirements ready: '+(r.reqsReady.length?r.reqsReady.length+' of '+(r.reqsReady.length+r.reqsMissing.length):'none yet'));
  r.reqsMissing.forEach(function(m){L.push('  Still needed: '+m)});
  return L.join('\n')}
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(list){var cols=[['ref','Reference'],['submittedAt','Submitted'],['type','Type'],['program','Program'],['lastName','Last name'],['firstName','First name'],['middleName','Middle name'],['suffix','Suffix'],['sex','Sex'],['civil','Civil status'],['birthdate','Birthdate'],['age','Age'],['mobile','Mobile'],['email','Email'],['facebook','Facebook'],['street','Street'],['barangay','Barangay'],['city','City'],['province','Province'],['education','Education'],['ecName','Emergency contact'],['ecRel','Relationship'],['ecMobile','Emergency mobile'],['empStatus','Employment status'],['usi','USI'],['basis','Assessment basis'],['basisFrom','Basis from'],['pay','Payment'],['source','Heard about us'],['notes','Notes']];
  var head=cols.map(function(c){return csvCell(c[1])}).concat(['Jobs','TESDA history','Classification','Requirements missing']).join(',');
  var rows=list.map(function(r){return cols.map(function(c){return csvCell(r[c[0]])}).concat([
    csvCell((r.jobs||[]).map(function(j){return j.position+' @ '+j.employer}).join('; ')),
    csvCell((r.tesda||[]).map(function(j){return j.prog+(j.year?' '+j.year:'')}).join('; ')),
    csvCell((r.classif||[]).join('; ')),csvCell((r.reqsMissing||[]).join('; '))]).join(',')});
  return '﻿'+head+'\n'+rows.join('\n')}

   +'<div class="alert info"><b>No online registration for assessment.</b> Slots are first come, first served, so you line up in person at our office.</div>'
   +'<div class="panel" style="margin-top:0"><h3>What to bring</h3><ul>'+ASSESS_REQ.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul></div>'
   +'<div class="panel"><h3>How it works</h3><ul><li>Complete all the requirements above.</li><li>Once complete, visit our office to line up for assessment and fill out the application form.</li><li>When 10 candidates are complete, we set the assessment schedule.</li><li>Questions about the requirements? Message us on Facebook anytime.</li></ul></div>'
   +'<div class="panel"><h3>Visit the office</h3><p style="margin:0">Beatitudes Technological &amp; Theological College, Anabu 1-E, Imus City, Cavite.<br>Landmark: Anabu Hills. First right after the second corner, then straight. We are on the left side.<br>Open 8:00 am to 5:00 pm.</p></div>'
   +'<div class="toolbar"><a class="btn" style="text-decoration:none" href="https://www.facebook.com/beatitudesimus" target="_blank" rel="noopener">Message us on Facebook</a><button class="btn ghost" data-act="home">Back to programs</button></div></div>'}
function drawDone(){
  var r=doneRec;app.className='wrap';
  var st=saved?'<div class="alert ok"><b>Saved to the school records.</b> Our staff can now see your registration.</div>'
    :'<div class="alert info"><b>One more step.</b> This page could not save your registration to the school records from your device. Copy the summary below and send it to our Facebook page by Messenger so the school has it.</div>';
  app.innerHTML='<div class="done"><div class="kick">Registration complete</div><h1>Thank you, '+esc(r.firstName)+'.</h1><div>Your reference number</div><div class="refbox">'+esc(r.ref)+'</div>'+st
   +'<textarea class="summary" id="sum" readonly aria-label="Registration summary">'+esc(summaryText(r))+'</textarea>'
   +'<div class="toolbar"><button class="btn" data-act="copy">Copy summary</button><a class="btn ghost" style="text-decoration:none" href="https://www.facebook.com/beatitudesimus" target="_blank" rel="noopener">Open our Facebook page</a><span id="copied" class="agebadge" role="status"></span></div>'
   +'<div class="panel"><h3>Next steps</h3><ul><li>Bring '+(r.type==='training'?'2 copies of each requirement':'your requirements')+' to the school office. Keep your reference number handy.</li>'
   +(r.reqsMissing.length?'<li>Still needed: '+r.reqsMissing.map(esc).join('; ')+'.</li>':'')
   +(r.type==='assessment'?'<li>Assessment fee: '+peso(prog.fee)+' + '+peso(PROCESSING_FEE)+' processing = '+peso(prog.fee+PROCESSING_FEE)+'.</li>':'')
   +'<li>Office: Anabu 1-E, Imus City, Cavite. Open 8:00 am to 5:00 pm.</li></ul></div>'
   +'<p style="margin-top:20px"><button class="btn ghost" data-act="home">Register for another program</button></p></div>'}
function filtered(){var s=q.trim().toLowerCase();return recs.slice().sort(function(a,b){return (b.submittedAt||'').localeCompare(a.submittedAt||'')}).filter(function(r){return !s||(fullName(r)+' '+r.program+' '+r.ref+' '+r.mobile).toLowerCase().indexOf(s)>-1})}
function drawRows(){var list=filtered(),b=$('#rows');if(!b)return;
  b.innerHTML=list.length?list.map(function(r){return '<tr data-act="detail" data-ref="'+esc(r.ref)+'"><td>'+esc(r.ref)+'</td><td>'+esc(fullName(r))+'</td><td>'+esc(r.program)+'</td><td>'+(r.type==='assessment'?'Assessment':'Training')+'</td><td>'+esc(r.mobile)+'</td><td>'+new Date(r.submittedAt).toLocaleDateString('en-PH')+'</td></tr>'}).join(''):'<tr><td colspan="6" style="white-space:normal;color:var(--muted)">No registrations yet. They appear here as students submit the form.</td></tr>';
  var c=$('#count');if(c)c.textContent=list.length+' of '+recs.length+' shown';
  var d=$('#detail');if(d){var r=recs.filter(function(x){return x.ref===detailRef})[0];d.hidden=!r;if(r)d.innerHTML='<h3>'+esc(fullName(r))+'</h3><pre class="det">'+esc(summaryText(r))+'</pre>'}}
function drawStaff(){app.className='wrap';
  app.innerHTML='<h1 style="font-size:30px">Registrations</h1><p class="lede">Everything submitted through this form while signed in with edit access.</p>'
   +'<div class="toolbar"><input id="q" type="search" placeholder="Search name, program, reference, or mobile" aria-label="Search registrations" value="'+esc(q)+'"><button class="btn" data-act="csv">Export CSV</button><button class="btn ghost" data-act="home">Back to form</button></div>'
   +'<div class="agebadge" id="count" style="margin-bottom:8px"></div><div class="tbl"><table><thead><tr><th>Reference</th><th>Name</th><th>Program</th><th>Type</th><th>Mobile</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div><div class="panel" id="detail" hidden></div>';
  drawRows()}
function render(){if(view==='home')drawHome();else if(view==='form')drawForm();else if(view==='assess')drawAssess();else if(view==='done')drawDone();else drawStaff();
  if(view!=='form'&&view!=='done'){}}
function toTop(){var c=$('#card');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'});else window.scrollTo(0,0)}

/* ---------- actions ---------- */
async function submit(){
  var e=validate(5);errs=e;if(Object.keys(e).length){drawForm();return}
  ref=makeRef();var rec=buildRecord();busy=true;saved=false;drawForm();
  try{if(db){await db.doc('registrations/'+ref).set(rec);saved=true}}catch(x){saved=false}
  busy=false;doneRec=rec;view='done';render();toTop()}
function copy(){var t=$('#sum'),m=$('#copied');var ok=function(){if(m)m.textContent='Copied'};
  var fb=function(){try{t.focus();t.select();if(document.execCommand('copy'))ok();else if(m)m.textContent='Select the text and copy it.'}catch(x){if(m)m.textContent='Select the text and copy it.'}};
  try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(x){fb()}}
async function csv(){try{var d=await window.claude.use('downloads');if(!d){return}
  await d.save({filename:'bttc-registrations-'+todayISO()+'.csv',data:toCSV(filtered())})}catch(x){}}
function startStaff(){view='staff';detailRef=null;render();
  if(!unsub&&db){try{unsub=db.collection('registrations').onSnapshot(function(s){recs=s.docs.map(function(d){return d.data()});if(view==='staff')drawRows()},function(){})}catch(x){}}}

app.addEventListener('click',function(ev){var t=ev.target.closest('[data-act]');if(!t)return;var a=t.dataset.act;
  if(a==='tab'){tab=t.dataset.t;drawHome()}
  else if(a==='pick'&&tab==='assessment'){prog=ASSESS.filter(function(p){return p.id===t.dataset.id})[0];view='assess';render();window.scrollTo(0,0)}
  else if(a==='pick'){mode=tab;prog=(tab==='training'?TRAINING:ASSESS).filter(function(p){return p.id===t.dataset.id})[0];f=freshForm();errs={};step=0;view='form';render();toTop()}
  else if(a==='back'){errs={};if(step===0){view='home';render()}else{step--;drawForm();toTop()}}
  else if(a==='next'){if(step===5){submit();return}var e=validate(step);errs=e;if(Object.keys(e).length){drawForm();return}step++;drawForm();toTop()}
  else if(a==='add'){f[t.dataset.key].push({});drawForm()}
  else if(a==='rm'){f[t.dataset.key].splice(+t.dataset.i,1);drawForm()}
  else if(a==='copy')copy();
  else if(a==='home'){view='home';render();window.scrollTo(0,0)}
  else if(a==='staff')startStaff();
  else if(a==='csv')csv();
  else if(a==='detail'){detailRef=t.dataset.ref;drawRows();var d=$('#detail');if(d&&d.scrollIntoView)d.scrollIntoView({block:'nearest'})}});
app.addEventListener('input',function(ev){var t=ev.target;
  if(t.id==='q'){q=t.value;drawRows();return}
  if(t.dataset&&t.dataset.row){f[t.dataset.row][+t.dataset.i][t.dataset.k]=t.value;return}
  if(t.name&&view==='form'&&t.type!=='radio'&&t.type!=='checkbox'){f[t.name]=t.value;
    if(t.name==='birthdate'){var a=ageOf(t.value),o=$('#ageOut');if(o)o.textContent=a!=null?'Age: '+a:'You must be at least 18 years old.'}}});
app.addEventListener('change',function(ev){var t=ev.target;if(view!=='form')return;
  if(t.dataset.row){f[t.dataset.row][+t.dataset.i][t.dataset.k]=t.value;return}
  if(t.type==='radio'){f[t.name]=t.value;delete errs[t.name];if(t.dataset.rr)drawForm();return}
  if(t.dataset.arr){var arr=f[t.dataset.arr],v=t.value,i=arr.indexOf(v);
    if(t.checked&&i<0)arr.push(v);if(!t.checked&&i>-1)arr.splice(i,1);
    if(t.dataset.arr==='classif'&&t.checked){if(v==='None of these')f.classif=['None of these'];else f.classif=f.classif.filter(function(x){return x!=='None of these'});drawForm()}
    return}
  if(t.dataset.flag){f[t.dataset.flag]=t.checked;delete errs.confirm;return}
  if(t.tagName==='SELECT'&&t.name){f[t.name]=t.value}});

render();
/* optional capabilities: the form works without them */
(async function(){try{if(!window.claude||!window.claude.use)return;
  db=await window.claude.use('db');var user=await window.claude.use('user');
  if(db&&user){var can=await user.can('data.write');staffOK=(can===true)}
  if(view==='home')drawHome()}catch(x){}})();
})();
</script>
</body></html>
